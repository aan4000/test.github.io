    <a   class="retorno" href="index.html">← pagina principal</a>
    
    <div class="wrapper">
        


         
    
        
        <div class="form_wrapper">

                
        
        

        
        <form id="form">
         <h2>haz contacto!</h2>          
          <div class="field">
              <label for="name">Nombre</label>
              <input type="text" name="name" id="name" required   placeholder="Tu numbre"   >
            </div>
            <div class="field">
                <label for="email">Correo</label>
                <input type="text" name="email" id="email" required  placeholder="ej,@correo">
                <div class="field">
                    <label for="message">Mensaje</label>
                    <textarea type="text" name="message" id="message"   cols="30"  rows="6"   ></textarea>
                </div>
                  
            </div>
            
            <div>

                <input class="in_btn"      type="submit" id="button" value="Enviar > " >
                <input class="in_btn"  id="reset"         type="reset" value="Restablecer">
            </div>

        </form>
        
        
        
    </div>
